# Checks for this repo come from https://github.com/buildthehomelab/wow-ci.
# They pick themselves based on what the repo contains (C++, SQL, Lua/.toc, PHP, shell, Python).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
#   with:
#     module: mod-foo          # only if the server folder isn't the repo name minus "wow-"
#     lua-exclude: "Astrolabe/**"

  catalog-integration:
    uses: buildthehomelab/wow-ci/.github/workflows/ci.yml@main
    permissions:
      contents: read
      packages: read
    with:
      only: cpp
      extra-modules: buildthehomelab/wow-mod-ah-bot-plus@c5884b76cedde344ee10c5aba63f00ac0f73ca74
